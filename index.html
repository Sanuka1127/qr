<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR GENERATOR⭐ - By Sanuka♦️</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;
  background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('bg.jpg');
  background-size:cover;background-position:center;background-attachment:fixed;
  font-family:system-ui,sans-serif;
}
.card{
  background: rgba(10,0,0,0.88);backdrop-filter: blur(14px);
  border:1.5px solid #ff0033;padding:28px;border-radius:26px;
  width:100%;max-width:410px;text-align:center;
  box-shadow: 0 0 60px rgba(255,0,51,0.6);
}
h1{margin:0;color:#ff002f;text-shadow:0 0 20px red;font-size:30px;letter-spacing:2px}
.sub{color:#ff99aa;margin:8px 0 22px;font-size:13px;letter-spacing:1px}
input{width:100%;padding:16px;border-radius:14px;border:1px solid #ff0033;background:rgba(40,0,0,0.8);color:#fff;font-size:16px;outline:none}
input:focus{box-shadow:0 0 25px #ff0033}
button{
  margin-top:16px;width:100%;padding:16px;border:none;border-radius:14px;
  background: linear-gradient(90deg, #ff0033, #990011);
  color:#fff;font-weight:bold;font-size:16px;cursor:pointer;box-shadow:0 0 20px rgba(255,0,51,0.5)
}
#loading{display:none;margin:25px 0}
#loading img{
  width:140px;height:140px;border-radius:50%;
  border:2px solid #ff0033;box-shadow:0 0 30px red;
  animation: spinPulse 1.2s ease-in-out infinite;
  object-fit:cover;
}
@keyframes spinPulse{
  0%{transform:scale(0.9) rotate(0deg);box-shadow:0 0 10px red}
  50%{transform:scale(1.05) rotate(5deg);box-shadow:0 0 40px red}
  100%{transform:scale(0.9) rotate(0deg);box-shadow:0 0 10px red}
}
#qrcode{margin:22px auto;background:#fff;padding:14px;border-radius:18px;display:none;justify-content:center;box-shadow:0 0 30px rgba(255,0,51,0.7)}
.footer{margin-top:20px;color:#ff3344;font-size:11px;opacity:.8}
</style>
</head>
<body>
<div class="card">
<h1>QR RED MOON</h1>
<div class="sub">MESSAGE TO QR • BY SANUKA</div>
<input id="text" placeholder="Enter your message...">
<button onclick="makeQR()">GENERATE QR 🔴</button>

<div id="loading">
  <img src="loading.jpg" alt="Loading">
  <p style="color:#ff99aa;margin-top:12px">Summoning...</p>
</div>

<div id="qrcode"></div>
<button id="dl" style="display:none;background:#1a0000;border:1px solid #ff0033" onclick="downloadQR()">DOWNLOAD QR 📥</button>
<div class="footer">MADE WITH ❤️ BY SANUKA🇱🇰</div>
</div>

<script>
function makeQR(){
 let t=document.getElementById('text').value.trim();
 if(!t) return alert('Enter a message!');
 document.getElementById('loading').style.display='block';
 document.getElementById('qrcode').style.display='none';
 document.getElementById('dl').style.display='none';
 setTimeout(()=>{
  document.getElementById('loading').style.display='none';
  document.getElementById('qrcode').innerHTML='';
  document.getElementById('qrcode').style.display='flex';
  new QRCode(document.getElementById('qrcode'),{text:t,width:210,height:210,colorDark:"#990011",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.H});
  document.getElementById('dl').style.display='block';
 }, 1300);
}
function downloadQR(){
 let img=document.querySelector('#qrcode img');
 if(img){let a=document.createElement('a');a.href=img.src;a.download='QR-Sanuka1127.png';a.click();}
}
</script>
</body>
                                    </html>
